name: Build JuliaTerm APK

on:
  push:
    branches: [main]
    paths:
      - "build-juliaterm.sh"
      - "packages/**"
      - "patches/**"
      - "app-src/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GENERATOR_REPO: Netsnake-TN/termux-generator-fork
  GENERATOR_REF: 737eab4e93f77a36d4ff33643d47c8b288030900

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout JuliaTerm
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true

      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends git patch unzip file

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # No setup-android step: its sdkmanager would prompt interactively for
      # licenses. The runner's preinstalled SDK with pre-accepted licenses is
      # sufficient; AGP auto-installs missing SDK components.

      - name: Clone termux-generator (pinned)
        run: |
          git clone --filter=blob:none "https://github.com/${GENERATOR_REPO}.git" generator
          git -C generator fetch --depth 1 origin "$GENERATOR_REF"
          git -C generator checkout FETCH_HEAD

      # pipefail: the tee pipe below masked the real exit code in runs
      # #10-#12 (the build failed, the step still reported green).
      - name: Build bootstrap + APK
        run: |
          set -o pipefail
          df -h / || true
          bash "${GITHUB_WORKSPACE}/build-juliaterm.sh" "${GITHUB_WORKSPACE}/generator" 2>&1 | tee "${RUNNER_TEMP}/build.log"

      - name: Diagnose failure
        if: failure()
        run: |
          echo "=== Disk usage after failure ==="
          df -h || true
          echo "=== Last 250 lines of build.log ==="
          if [ -f "${RUNNER_TEMP}/build.log" ]; then
            tail -n 250 "${RUNNER_TEMP}/build.log" || true
          else
            echo "build.log not found (step may have failed before tee started)"
          fi

      # Publish the failure diagnostics where they are readable without a
      # GitHub login: a public issue (anonymous log/artifact downloads are
      # login-only, which made run #28 undiagnosable from outside).
      - name: Publish failure diagnostics (public issue)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let tail = 'build.log not found (step may have failed before tee started)';
            try {
              const log = fs.readFileSync(process.env.RUNNER_TEMP + '/build.log', 'utf8');
              const lines = log.split('\n');
              tail = lines.slice(-330).join('\n');
              if (tail.length > 55000) { tail = tail.slice(tail.length - 55000); }
            } catch (e) { tail = 'could not read build.log: ' + e.message; }
            try {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `CI failure diagnostics (run #` + context.runNumber + `)`,
                body: `<details><summary>build.log tail (last ~330 lines, run #` + context.runNumber + `)</summary>\n\n` +
                       '```' + `\n` + tail + `\n` + '```' + `\n\n</details>`
              });
              core.info('Diagnostics issue created.');
            } catch (e) {
              core.warning('Could not create diagnostics issue: ' + e.message);
            }

      - name: Post-build report
        if: always()
        run: |
          GEN="$GITHUB_WORKSPACE/generator"
          echo "=== build.log tail (last 60 lines) ==="
          tail -n 60 "${RUNNER_TEMP}/build.log" 2>/dev/null || echo "no build.log"
          echo "=== generator/ root ==="
          ls -lah "$GEN" || true
          echo "=== termux-apps-main/ ==="
          ls -lah "$GEN/termux-apps-main" || true
          echo "=== termux-app gradle outputs ==="
          find "$GEN/termux-apps-main/termux-app/app/build/outputs" -maxdepth 4 -type f -exec ls -lah {} + 2>/dev/null || echo "NO GRADLE OUTPUTS DIR"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ runner.temp }}/build.log
          retention-days: 7
          if-no-files-found: ignore

      - name: Collect artifacts
        id: collect
        run: |
          mkdir -p artifacts
          echo "=== every .apk under the workspace ==="
          apk_count=$(find "$GITHUB_WORKSPACE" -name "*.apk" -not -path "*/.git/*" | wc -l)
          echo "APK files found: $apk_count"
          find "$GITHUB_WORKSPACE" -name "*.apk" -not -path "*/.git/*" -exec ls -lah {} + 2>/dev/null || true
          find "$GITHUB_WORKSPACE" -name "*.apk" -not -path "*/.git/*" -exec cp {} artifacts/ \; 2>/dev/null || true
          if [ "$(ls artifacts/*universal*.apk 2>/dev/null | wc -l)" -eq 1 ]; then
            mv artifacts/*universal*.apk artifacts/JuliaTerm-universal.apk
          fi
          echo "count=$(ls -A artifacts 2>/dev/null | wc -l)" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        if: steps.collect.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: JuliaTerm-apk
          path: artifacts/*
          retention-days: 30

      - name: Release
        if: steps.collect.outputs.count != '0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.2
          name: JuliaTerm v0.3.2
          files: artifacts/*
          body: |
            JuliaTerm v0.2.1

            Termux-free Julia REPL for Android (aarch64).

            - Package id: com.st0n89.juliaterm
            - Single APK with embedded minimal bootstrap
              (bash, coreutils, curl, proot, proot-distro, juliaterm-scripts)
            - First `julia` run installs Debian proot + juliaup
            - `julia-update` updates Julia via juliaup
            - v0.1.2: fixed the first `julia` run self-recursion: the boot
              script found this app's own wrapper on the guest PATH (host
              prefix is bound+on PATH inside the proot) and re-entered
              proot-distro inside the guest; Julia is now resolved by
              absolute path ($HOME/.juliaup/bin/julia)
            - v0.1.3: fixed the v0.1.2 on-device failure "No CA certificates
              were loaded from the system": the guest PATH exposes the host
              curl, so the apt fallback never installed ca-certificates in
              the rootfs; curl and CA store are now checked by absolute path
              inside the guest only
            - v0.2.0 UI phase 1: fullscreen REPL - immersive sticky system
              bars (status/nav hidden until edge swipe), deep aubergine
              launch window background, and default runtime config shipped
              in the bootstrap (fullscreen = true, night-mode = true, zero
              terminal margins, Julia dusk color palette); planted to
              ~/.termux on first shell, applies after one app restart
            - v0.2.1: new `notebook` command - one-command Pluto.jl reactive
              notebook server; auto-installs Pluto on first use, serves the
              phone browser on localhost:8889, notebooks saved in the
              container's /root (or the v0.3.0 workdir, if one is set)
            - v0.3.0 UI phase 2: in-app workdir picker. New drawer button
              "Select workdir" browses the phone's Documents folder
              (fallback: storage root), requests the storage permission
              when needed, and saves the choice; the next `julia` or
              `notebook` binds that folder as /workdir and starts there,
              so notebooks and scripts land directly in the chosen phone
              folder. Long-press the button to clear the choice. Drawer
              rebranded to the dark Julia palette (aubergine background,
              light session titles and icons).
            - v0.3.1: the workdir picker now browses ALL storage volumes
              starting from the storage root - internal storage and SD
              card - with volume labels ("Internal storage", "SD card"),
              instead of only the Documents folder; any folder on any
              volume can be chosen as the workdir
            - v0.3.2: picker volume probing no longer requires the
              /storage root itself to be listable (it is not on some
              devices, e.g. /e/OS on Fairphone; volumes are now probed
              directly with an android StorageManager fallback); new
              drawer button "Start notebook" - runs the `notebook`
              command in a fresh terminal session and opens the Pluto
              page in the browser as soon as the server on localhost:8889
              is up (also works later as a plain "reopen notebooks"
              shortcut while the server runs)
            - Debug-signed (Termux test key). Install via sideloading.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
