name: Build JuliaTerm APK

on:
  push:
    branches: [main]
    paths:
      - "build-juliaterm.sh"
      - "packages/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GENERATOR_REPO: Netsnake-TN/termux-generator-fork
  GENERATOR_REF: 737eab4e93f77a36d4ff33643d47c8b288030900

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - name: Checkout JuliaTerm
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true

      - name: Install dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends git patch unzip file

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # No setup-android step: its sdkmanager would prompt interactively for
      # licenses. The runner's preinstalled SDK with pre-accepted licenses is
      # sufficient; AGP auto-installs missing SDK components.

      - name: Clone termux-generator (pinned)
        run: |
          git clone --filter=blob:none "https://github.com/${GENERATOR_REPO}.git" generator
          git -C generator fetch --depth 1 origin "$GENERATOR_REF"
          git -C generator checkout FETCH_HEAD

      # pipefail: the tee pipe below masked the real exit code in runs
      # #10-#12 (the build failed, the step still reported green).
      - name: Build bootstrap + APK
        run: |
          set -o pipefail
          df -h / || true
          bash "${GITHUB_WORKSPACE}/build-juliaterm.sh" "${GITHUB_WORKSPACE}/generator" 2>&1 | tee "${RUNNER_TEMP}/build.log"

      # GitHub truncates huge step logs in the web UI (this hid run #9's, #10's
      # and #11's real endings). This short step prints the crash reason fully.
      - name: Diagnose failure
        if: failure()
        run: |
          echo "=== Disk usage after failure ==="
          df -h || true
          echo "=== Last 250 lines of build.log ==="
          if [ -f "${RUNNER_TEMP}/build.log" ]; then
            tail -n 250 "${RUNNER_TEMP}/build.log" || true
          else
            echo "build.log not found (step may have failed before tee started)"
          fi

      # Runs #10 and #11 were green but produced ZERO apks anywhere in the
      # workspace and no release (silent skip). This report runs on success
      # too and shows the true end state of the build, fully readable.
      - name: Post-build report
        if: always()
        run: |
          GEN="$GITHUB_WORKSPACE/generator"
          echo "=== build.log tail (last 60 lines) ==="
          tail -n 60 "${RUNNER_TEMP}/build.log" 2>/dev/null || echo "no build.log"
          echo "=== generator/ root ==="
          ls -lah "$GEN" || true
          echo "=== termux-apps-main/ ==="
          ls -lah "$GEN/termux-apps-main" || true
          echo "=== termux-app gradle outputs ==="
          find "$GEN/termux-apps-main/termux-app/app/build/outputs" -maxdepth 4 -type f -exec ls -lah {} + 2>/dev/null || echo "NO GRADLE OUTPUTS DIR"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ runner.temp }}/build.log
          retention-days: 7
          if-no-files-found: ignore

      # Run #10 was green but found ZERO apks at generator/ root, so artifact
      # upload and release silently skipped. This step now searches the whole
      # workspace and reports every .apk path, so the next run shows where the
      # APKs actually land.
      - name: Collect artifacts
        id: collect
        run: |
          mkdir -p artifacts
          echo "=== every .apk under the workspace ==="
          apk_count=$(find "$GITHUB_WORKSPACE" -name "*.apk" -not -path "*/.git/*" | wc -l)
          echo "APK files found: $apk_count"
          find "$GITHUB_WORKSPACE" -name "*.apk" -not -path "*/.git/*" -exec ls -lah {} + 2>/dev/null || true
          find "$GITHUB_WORKSPACE" -name "*.apk" -not -path "*/.git/*" -exec cp {} artifacts/ \; 2>/dev/null || true
          if [ "$(ls artifacts/*universal*.apk 2>/dev/null | wc -l)" -eq 1 ]; then
            mv artifacts/*universal*.apk artifacts/JuliaTerm-universal.apk
          fi
          echo "count=$(ls -A artifacts 2>/dev/null | wc -l)" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        if: steps.collect.outputs.count != '0'
        uses: actions/upload-artifact@v4
        with:
          name: JuliaTerm-apk
          path: artifacts/*
          retention-days: 30

      - name: Release
        if: steps.collect.outputs.count != '0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.1
          name: JuliaTerm v0.1.1
          files: artifacts/*
          body: |
            JuliaTerm v0.1.1

            Termux-free Julia REPL for Android (aarch64).

            - Package id: com.st0n89.juliaterm
            - Single APK with embedded minimal bootstrap
              (bash, coreutils, curl, proot, proot-distro, juliaterm-scripts)
            - First `julia` run installs Debian proot + juliaup
            - `julia-update` updates Julia via juliaup
            - v0.1.1: fixes the first `julia` run with current proot-distro
              (container storage moved to containers/<name>/rootfs)
            - Debug-signed (Termux test key). Install via sideloading.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
